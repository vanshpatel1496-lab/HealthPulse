services:
  - type: web
    name: healthpulse-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_LIVE_CALLS_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
